# ═══════════════════════════════════════════════════════════════
#  نظام تفعيل خدمات الاتصالات - إعدادات Gradle
#  الإصدار 3.0 - محسّن للأداء والتوافق مع Android 14
# ═══════════════════════════════════════════════════════════════
#
#  تم تحديث هذا الملف ليشمل أفضل الممارسات والإعدادات
#  المحسّنة لبناء أسرع وأكثر استقراراً.
#
#  التحسينات:
#  1. تحسين أداء البناء (Parallel, Caching, Configuration Cache)
#  2. تعيين ذاكرة كافية لـ Gradle و Kotlin
#  3. دعم AndroidX و Jetifier
#  4. إعدادات R8 و ProGuard
#  5. تحسينات Kotlin Compiler
#  6. إزالة الإعدادات القديمة غير المستخدمة
# ═══════════════════════════════════════════════════════════════

# ============================================================
#  أداء البناء - Build Performance
# ============================================================

# تحسين أداء JVM - تخصيص الذاكرة وترميز UTF-8
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# تمكين البناء المتوازي (تحسين سرعة البناء)
org.gradle.parallel=true

# تمكين التخزين المؤقت (تسريع إعادة البناء)
org.gradle.caching=true

# تمكين Configuration Cache (تحسين سرعة مرحلة التهيئة)
org.gradle.configuration-cache=true

# تحديد عدد العمال المتوازيين (يعادل عدد أنوية المعالج)
org.gradle.workers.max=4

# ============================================================
#  Kotlin Compiler - محسن Kotlin
# ============================================================

# نمط كود Kotlin الرسمي (يساعد في تنسيق الكود)
kotlin.code.style=official

# استراتيجية تنفيذ Kotlin Compiler (أفضل أداء)
kotlin.compiler.execution.strategy=in-process

# تحسين دقة Kotlin (لمشاريع كبيرة)
kotlin.incremental=true

# Kotlin 2.x uses the K2 compiler by default; no experimental toggles are needed.

# ============================================================
#  Android Build - إعدادات البناء
# ============================================================

# تمكين AndroidX (إلزامي للمشاريع الحديثة)
android.useAndroidX=true

# إلغاء تفعيل إنشاء R.java غير الضروري (تقليل وقت البناء)
android.nonTransitiveRClass=true

# تمكين الوضع الكامل لـ R8 (تحسين التعتيم والتقليص)
android.enableR8.fullMode=true

# ============================================================
#  ProGuard / R8 - تقليص الكود والتعتيم
# ============================================================

# تقليص الملفات غير المستخدمة (تقليل حجم APK)
android.enableResourceOptimizations=true

# ============================================================
#  التحذيرات والتوافق - Warnings & Compatibility
# ============================================================

# تجاهل تحذير compileSdk غير المدعوم (للتوافق مع SDK 34)
android.suppressUnsupportedCompileSdk=34

# Existing compatibility workaround: androidx.core 1.15 declares compileSdk 35 metadata.
# Keep compileSdk 34 unchanged until the Android SDK/CI toolchain is upgraded together.
android.experimental.disableCompileSdkChecks=true

# ============================================================
#  التصحيح والتطوير - Debug & Development
# ============================================================

# تمكين تفعيل السجلات في وضع التطوير (يمكن تعطيله في الإصدار النهائي)
android.debug.obsoleteApi=true

# ============================================================
#  ملاحظات حول الإصدارات
# ============================================================

# ⚠️ هذا التطبيق يستخدم compileSdk=34 (Android 14)
# ⚠️ يستخدم targetSdk=34 (Android 14)
# ⚠️ يستخدم minSdk=21 (Android 5.0 Lollipop)


