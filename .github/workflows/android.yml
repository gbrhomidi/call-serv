name: Build Android APK

on:
  push:
    branches:
      - main
      - feat/sms-activation-bank-reconciliation
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:
  validate:
    name: Validate Android Project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Set up Java 17 and Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Gradle wrapper
        run: |
          set -euo pipefail
          test -f ./gradlew || { echo "::error::gradlew is missing."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.properties || { echo "::error::Gradle wrapper configuration is missing."; exit 1; }
          chmod +x ./gradlew

      - name: Verify and run SMS activation smoke tests
        run: |
          set -euo pipefail
          test -f ./screen-smoke-test.py || { echo "::error::screen-smoke-test.py is missing."; exit 1; }
          python3 ./screen-smoke-test.py

      - name: Run Kotlin and Robolectric regression tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Compile Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      # Feature-branch builds are installable development APKs signed by the
      # runner's temporary Android debug key. They are for fresh installation;
      # remove an existing differently-signed app before installing.
      - name: Verify and prepare fresh-install APK from requested branch
        if: github.ref == 'refs/heads/feat/sms-activation-bank-reconciliation' && github.event_name != 'pull_request'
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          test -s "$APK_PATH" || { echo "::error::Debug APK is missing or empty."; exit 1; }
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner" || { echo "::error::apksigner was not found."; exit 1; }
          test -x "$build_tools/aapt" || { echo "::error::aapt was not found."; exit 1; }
          "$build_tools/apksigner" verify --verbose "$APK_PATH"
          AAPT_PATH="$build_tools/aapt" python3 - <<'PY'
          import os, re, subprocess, sys
          output = subprocess.check_output([os.environ["AAPT_PATH"], "dump", "badging", os.environ["APK_PATH"]], text=True)
          match = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'", output, re.MULTILINE)
          if not match:
              sys.exit("::error::Could not read package/version metadata from the APK.")
          package, version_code, version_name = match.groups()
          if package != "com.aistudio.dieselstationsms.kxmpzq":
              sys.exit(f"::error::Unexpected applicationId: {package}")
          if int(version_code) < 301:
              sys.exit(f"::error::Expected versionCode >= 301, got {version_code}.")
          print(f"Verified installable feature APK: {package}, versionCode={version_code}, versionName={version_name}")
          PY
          rm -rf feature-apk
          mkdir -p feature-apk
          cp "$APK_PATH" feature-apk/CallServ_SMS_Activation_FreshInstall.apk
          (cd feature-apk && sha256sum CallServ_SMS_Activation_FreshInstall.apk > SHA256SUMS.txt)

      - name: Upload installable APK from feature branch
        if: github.ref == 'refs/heads/feat/sms-activation-bank-reconciliation' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: CallServ_SMS_Activation_FreshInstall
          path: |
            feature-apk/CallServ_SMS_Activation_FreshInstall.apk
            feature-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build Signed Upgrade APK
    needs: validate
    # Only the production branch may access signing secrets. Pull requests and feature pushes validate only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Set up Java 17 and Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify signing secrets exist
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required Actions repository secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the existing production signing credentials under Settings > Secrets and variables > Actions. Never commit or paste them into source files."
            exit 1
          fi
          echo "All required release-signing secret names are present."

      - name: Decode release keystore outside workspace
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          key_path="$RUNNER_TEMP/call-serv-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          if [ ! -s "$key_path" ]; then
            echo "::error::Decoded release keystore is empty."
            rm -f "$key_path"
            exit 1
          fi
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew clean :app:assembleRelease --no-daemon -PGEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Locate exactly one signed Release APK
        id: apk
        run: |
          set -euo pipefail
          test -d app/build/outputs/apk/release || { echo "::error::Release APK output directory is missing."; exit 1; }
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*-unsigned.apk' ! -name '*-unaligned.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed Release APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          test -s "${apks[0]}" || { echo "::error::Release APK is empty."; exit 1; }
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify signature and Android update identity
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner" || { echo "::error::apksigner was not found."; exit 1; }
          test -x "$build_tools/aapt" || { echo "::error::aapt was not found."; exit 1; }
          "$build_tools/apksigner" verify --verbose --print-certs "$APK_PATH"
          AAPT_PATH="$build_tools/aapt" python3 - <<'PY'
          import os, re, subprocess, sys
          apk = os.environ["APK_PATH"]
          aapt = os.environ["AAPT_PATH"]
          output = subprocess.check_output([aapt, "dump", "badging", apk], text=True)
          match = re.search(r"^package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'", output, re.MULTILINE)
          if not match:
              sys.exit("::error::Could not read package/version metadata from the APK.")
          package, version_code, version_name = match.groups()
          if package != "com.aistudio.dieselstationsms.kxmpzq":
              sys.exit(f"::error::Unexpected applicationId: {package}")
          if int(version_code) < 301:
              sys.exit(f"::error::versionCode {version_code} is not greater than the previously published baseline 300.")
          print(f"Verified update identity: {package}, versionCode={version_code}, versionName={version_name}")
          PY

      - name: Prepare APK and SHA256 checksum
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          cp "$APK_PATH" release-artifact/CallServ_SMS_Activation_Release.apk
          (cd release-artifact && sha256sum CallServ_SMS_Activation_Release.apk > SHA256SUMS.txt)
          test -s release-artifact/CallServ_SMS_Activation_Release.apk
          test -s release-artifact/SHA256SUMS.txt
          ls -lh release-artifact
          cat release-artifact/SHA256SUMS.txt

      - name: Remove release keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/call-serv-release.keystore"

      - name: Upload signed upgrade APK
        uses: actions/upload-artifact@v6
        with:
          name: CallServ_SMS_Activation_Release
          path: |
            release-artifact/CallServ_SMS_Activation_Release.apk
            release-artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
